<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Data</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f1720;
    color: #e6edf3;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
    margin: 0;
  }
  .card {
    background: #161f2c;
    border: 1px solid #23303f;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 20px;
    text-align: center;
    color: #ffffff;
  }
  label {
    display: block;
    font-size: 13px;
    color: #9fb0c0;
    margin: 14px 0 6px;
  }
  input[type="date"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2c3b4a;
    background: #0f1720;
    color: #e6edf3;
    font-size: 15px;
  }
  input:focus { outline: 2px solid #4b8bf5; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4b8bf5;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3a76e0; }
  .resultados {
    margin-top: 24px;
    display: none;
  }
  .resultado-item {
    background: #0f1720;
    border: 1px solid #23303f;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .resultado-item .titulo {
    font-size: 12px;
    color: #9fb0c0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .resultado-item .data {
    font-size: 22px;
    font-weight: 700;
    color: #7fd88f;
    margin-top: 4px;
  }
  .resultado-item .subinfo {
    font-size: 12px;
    color: #6b7a8a;
    margin-top: 4px;
  }
  .obs {
    font-size: 11px;
    color: #6b7a8a;
    margin-top: 18px;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <h1>📅 Calculadora de Data</h1>

  <label for="dataInicial">Data inicial</label>
  <input type="date" id="dataInicial">

  <label for="numDias">Número de dias</label>
  <input type="number" id="numDias" min="1" value="90">

  <button onclick="calcular()">Calcular</button>

  <div class="resultados" id="resultados">
    <div class="resultado-item">
      <div class="titulo">Dias corridos</div>
      <div class="data" id="resultadoCorridos">--</div>
      <div class="subinfo" id="subCorridos"></div>
    </div>
    <div class="resultado-item">
      <div class="titulo">Dias úteis (seg a sex)</div>
      <div class="data" id="resultadoUteis">--</div>
      <div class="subinfo" id="subUteis"></div>
    </div>
  </div>

  <div class="obs">
    * Dias úteis considera apenas sábados e domingos como não úteis.<br>
    Feriados nacionais/estaduais/municipais não são descontados.
  </div>
</div>

<script>
// Define a data inicial padrão como hoje
document.getElementById('dataInicial').valueAsDate = new Date();

function formatarData(date) {
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const dd = String(date.getDate()).padStart(2, '0');
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const yyyy = date.getFullYear();
  return { texto: `${dd}/${mm}/${yyyy}`, diaSemana: dias[date.getDay()] };
}

function calcular() {
  const dataInicialInput = document.getElementById('dataInicial').value;
  const numDias = parseInt(document.getElementById('numDias').value);

  if (!dataInicialInput || isNaN(numDias) || numDias < 1) {
    alert('Preencha a data inicial e um número de dias válido.');
    return;
  }

  // Corrigir fuso horário: criar data em UTC "puro" a partir do input
  const [ano, mes, dia] = dataInicialInput.split('-').map(Number);
  const dataBase = new Date(ano, mes - 1, dia);

  // --- Dias corridos ---
  const dataCorridos = new Date(dataBase);
  dataCorridos.setDate(dataCorridos.getDate() + numDias);
  const fCorridos = formatarData(dataCorridos);
  document.getElementById('resultadoCorridos').textContent = fCorridos.texto;
  document.getElementById('subCorridos').textContent =
    `${dataBase.toLocaleDateString('pt-BR')} + ${numDias} dias = ${fCorridos.diaSemana}`;

  // --- Dias úteis (soma dias, pulando sábados e domingos) ---
  const dataUteis = new Date(dataBase);
  let contador = 0;
  while (contador < numDias) {
    dataUteis.setDate(dataUteis.getDate() + 1);
    const diaSemana = dataUteis.getDay(); // 0=domingo, 6=sábado
    if (diaSemana !== 0 && diaSemana !== 6) {
      contador++;
    }
  }
  const fUteis = formatarData(dataUteis);
  document.getElementById('resultadoUteis').textContent = fUteis.texto;
  document.getElementById('subUteis').textContent =
    `${dataBase.toLocaleDateString('pt-BR')} + ${numDias} dias úteis = ${fUteis.diaSemana}`;

  document.getElementById('resultados').style.display = 'block';
}

// Calcula automaticamente ao carregar
window.onload = calcular;
</script>

</body>
</html>
