<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca de Aplicativos — mapgeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #22303f;
    --panel: #263646;
    --border: #37495c;
    --text: #ecf0f4;
    --muted: #93a1b0;
    --accent: #4b8bf5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }

  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #4b8bf5, #8f7ff2);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  #busca {
    flex: 1; min-width: 200px; max-width: 420px;
    position: relative;
  }
  #busca input {
    width: 100%;
    background: #1b2734;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 14px 9px 34px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  #busca span {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--muted);
  }
  #status {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    margin-left: auto;
  }
  #status.ok { color: #7fd88f; }
  #status.erro { color: #e0678a; }

  #btnAtualizar {
    background: #1b2734;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 7px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  #btnAtualizar:hover { border-color: var(--accent); }
  #btnAtualizar:disabled { opacity: 0.5; cursor: default; }
  #btnAtualizar .girando { display: inline-block; animation: girar 0.8s linear infinite; }
  @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  main { padding: 28px; flex: 1; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .icone {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; color: #14202c;
  }
  .titulo { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .nomearq {
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
    color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #vazio, #carregando {
    text-align: center; color: var(--muted); margin-top: 80px; font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1><span class="logo">📚</span> Biblioteca de Aplicativos</h1>
  <div id="busca">
    <span>🔎</span>
    <input type="text" id="inputBusca" placeholder="Buscar app...">
  </div>
  <div id="status">Carregando...</div>
  <button id="btnAtualizar" title="Forçar nova busca por apps agora">🔄 Atualizar</button>
</header>

<main>
  <div id="carregando">Buscando apps no repositório...</div>
  <div id="vazio" style="display:none">Nenhum app .html encontrado no repositório.</div>
  <div id="grid"></div>
</main>

<script>
// ---- CONFIGURAÇÃO ----
const GITHUB_USER = 'atendimentomapgeo-byte';
const GITHUB_REPO = 'biblioteca-de-app';
const GITHUB_BRANCH = 'main';
const REFRESH_MS = 120000; // reconsulta a cada 2 minutos
const CACHE_KEY = 'biblioteca-apps-cache';
const CACHE_MAX_IDADE_MS = 30 * 60 * 1000; // usa cache de até 30min como plano B
const ETAG_KEY = 'biblioteca-apps-etag'; // ETag da última resposta 200 da API do GitHub

// Apps que moram em subpastas (ex: PWAs com vários arquivos) não são
// detectados pela varredura automática — adicione-os aqui manualmente.
//
// Duas formas de declarar cada app extra:
//   1) "path": app dentro do MESMO repositório da biblioteca (biblioteca-de-app),
//      caminho relativo à raiz do repositório até o index.html do app.
//   2) "url": app hospedado em OUTRO repositório/site GitHub Pages (ou
//      qualquer URL própria) — usa a URL absoluta diretamente, sem
//      combinar com o repositório da biblioteca.
const APPS_EXTRAS = [
  // FieldGIS vive na subpasta "fieldgis-app" deste mesmo repositório
  // (biblioteca-de-app/fieldgis-app/index.html).
  { titulo: 'FieldGIS — Mapas e Navegação de Campo', path: 'fieldgis-app/index.html' },
];

const PAGES_BASE = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;
// Listagem da RAIZ do repositório direto na API do GitHub — reflete o conteúdo atual na hora
// (sem esperar nenhum CDN reindexar nada), então é a fonte PRINCIPAL usada agora. É pública, não
// precisa de token nenhum pra ler; só tem o limite de 60 requisições/hora por IP sem login — por
// isso o pedido sempre manda o ETag salvo da última vez (ver buscarApps): quando nada mudou no
// repositório, o GitHub responde "304 Not Modified" SEM CONSUMIR NADA da cota, então o
// atualiza-a-cada-2-minutos abaixo praticamente não gasta limite de requisição no dia a dia.
const GITHUB_CONTENTS_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;
// jsDelivr fica como PLANO B, só se a API do GitHub falhar (rede bloqueando api.github.com,
// limite de requisição estourado, etc.) — o CDN dele pode demorar bem mais pra refletir um
// commit novo (é aquele atraso que fazia apps recém-adicionados não aparecerem aqui).
const JSDELIVR_URL = `https://data.jsdelivr.com/v1/package/gh/${GITHUB_USER}/${GITHUB_REPO}@${GITHUB_BRANCH}/flat`;

const CORES = ['#4b8bf5','#4bc0d9','#7fd88f','#f2b84b','#e0678a','#8f7ff2'];

function corParaNome(nome) {
  let hash = 0;
  for (let i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  return CORES[Math.abs(hash) % CORES.length];
}

function tituloBonito(nomeArquivo) {
  const semExt = nomeArquivo.replace(/\.html?$/i, '');
  const espacado = semExt.replace(/[_-]+/g, ' ').trim();
  return espacado.charAt(0).toUpperCase() + espacado.slice(1);
}

const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const vazioEl = document.getElementById('vazio');
const carregandoEl = document.getElementById('carregando');
const inputBusca = document.getElementById('inputBusca');
const btnAtualizar = document.getElementById('btnAtualizar');

let todosOsApps = [];

function setStatus(msg, tipo) {
  statusEl.textContent = msg;
  statusEl.className = tipo || '';
}

function lerCache() {
  try {
    const bruto = localStorage.getItem(CACHE_KEY);
    if (!bruto) return null;
    const cache = JSON.parse(bruto);
    if (!Array.isArray(cache.apps)) return null;
    return cache;
  } catch (e) {
    return null;
  }
}

function salvarCache(apps) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ apps, timestamp: Date.now() }));
  } catch (e) {
    // localStorage indisponível (modo privado, por ex.) — segue sem cache
  }
}

function usarCacheComoFallback(motivoErro) {
  const cache = lerCache();
  if (cache && cache.apps.length > 0) {
    todosOsApps = cache.apps;
    const minutos = Math.round((Date.now() - cache.timestamp) / 60000);
    carregandoEl.style.display = 'none';
    setStatus(`${motivoErro} — mostrando lista salva há ${minutos} min`, 'erro');
    renderizar();
    return true;
  }
  return false;
}

// Nomes de arquivo .html na raiz do repositório, contando como "app" (exclui o próprio index).
function ehArquivoDeApp(nome) {
  return /^[^/]+\.html?$/i.test(nome) && !/^index\.html?$/i.test(nome);
}

function aplicarListaEncontrada(nomes, mensagemOk) {
  todosOsApps = nomes
    .map(nome => ({ name: nome }))
    .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  salvarCache(todosOsApps);
  carregandoEl.style.display = 'none';
  setStatus(mensagemOk, 'ok');
  renderizar();
}

// Fonte PRINCIPAL: lista a raiz do repositório direto na API do GitHub (contents), que reflete
// o commit mais recente na hora — sem o atraso de cache de CDN que fazia apps recém-adicionados
// não aparecerem. Usa o ETag salvo da consulta anterior pra pedir "só me avisa se mudou algo"
// (If-None-Match); um 304 de volta não consome nada da cota de 60 req/hora sem login.
// Retorna true se conseguiu resolver a lista (nova ou "sem mudanças"), false se precisa cair
// pro plano B (jsDelivr).
async function buscarViaGithubApi() {
  const etagSalvo = localStorage.getItem(ETAG_KEY) || '';
  const headers = { 'Accept': 'application/vnd.github+json' };
  if (etagSalvo) headers['If-None-Match'] = etagSalvo;
  const resp = await fetch(GITHUB_CONTENTS_URL, { headers });

  if (resp.status === 304) {
    // Nada mudou no repositório desde a última vez — mantém a lista atual. Se a tela abriu com
    // 'todosOsApps' vazio (cache local passou dos 30min e não foi usado pra exibir na hora, mas
    // o ETag salvo junto com ele continua valendo, já que o servidor acabou de confirmar isso),
    // recarrega esse mesmo cache em vez de mostrar "0 apps" por engano.
    if (todosOsApps.length === 0) {
      const cache = lerCache();
      if (cache && cache.apps.length > 0) todosOsApps = cache.apps;
    }
    carregandoEl.style.display = 'none';
    setStatus(`${todosOsApps.length} app(s) — sem mudanças no repositório`, 'ok');
    renderizar();
    return true;
  }
  if (!resp.ok) {
    // 403 costuma ser limite de requisição estourado (raro, só em uso muito intenso e
    // simultâneo); 404 seria repositório/branch errado. Em qualquer caso, deixa o jsDelivr
    // tentar antes de desistir de vez.
    return false;
  }

  const etagNovo = resp.headers.get('etag');
  if (etagNovo) { try { localStorage.setItem(ETAG_KEY, etagNovo); } catch (e) {} }

  const itens = await resp.json();
  if (!Array.isArray(itens)) return false; // resposta inesperada (ex.: raiz virou um arquivo?)

  const nomes = itens
    .filter(item => item.type === 'file' && ehArquivoDeApp(item.name))
    .map(item => item.name);

  aplicarListaEncontrada(nomes, `${nomes.length} app(s) encontrado(s)`);
  return true;
}

// Plano B: jsDelivr, só quando a API do GitHub não respondeu (rede bloqueando api.github.com,
// limite de requisição estourado, etc.) — pode estar desatualizado em relação ao commit mais
// recente, por isso o aviso deixa isso claro em vez de passar a impressão de que está tudo certo.
async function buscarViaJsDelivr() {
  let resp;
  try {
    resp = await fetch(JSDELIVR_URL);
  } catch (e) {
    throw new Error('Falha ao conectar com o jsDelivr');
  }
  if (!resp.ok) {
    const motivo = resp.status === 404
      ? 'Repositório ou branch não encontrado'
      : 'Erro ao consultar o jsDelivr (' + resp.status + ')';
    throw new Error(motivo);
  }
  const dados = await resp.json();
  const arquivos = Array.isArray(dados.files) ? dados.files : [];
  const nomes = arquivos
    // jsDelivr retorna caminhos com "/" na frente; nome de exibição sem a barra
    .map(f => f.name.replace(/^\//, ''))
    .filter(ehArquivoDeApp);
  aplicarListaEncontrada(nomes, `${nomes.length} app(s) encontrado(s) (via jsDelivr — pode estar até algumas horas desatualizado)`);
}

async function buscarApps() {
  try {
    const resolveuPelaApi = await buscarViaGithubApi();
    if (resolveuPelaApi) return;
  } catch (e) {
    console.error('Falha ao consultar a API do GitHub', e);
  }
  // Chegou aqui: a API do GitHub não deu uma resposta utilizável — tenta o plano B antes de
  // recorrer ao cache local (que pode estar bem mais velho que qualquer um dos dois planos).
  try {
    await buscarViaJsDelivr();
  } catch (e) {
    console.error(e);
    const motivo = e.message || 'Falha ao conectar com o jsDelivr';
    if (!usarCacheComoFallback(motivo)) {
      setStatus(motivo, 'erro');
      carregandoEl.style.display = 'none';
      renderizar();
    }
  }
}

// Mostra o cache instantaneamente ao abrir a página, sem esperar a rede,
// e só então dispara a busca atualizada por trás.
const cacheInicial = lerCache();
if (cacheInicial && cacheInicial.apps.length > 0 && (Date.now() - cacheInicial.timestamp) < CACHE_MAX_IDADE_MS) {
  todosOsApps = cacheInicial.apps;
  carregandoEl.style.display = 'none';
  setStatus('Carregando lista salva...', '');
  renderizar();
}

function renderizar() {
  const termo = inputBusca.value.trim().toLowerCase();

  const autoApps = todosOsApps.map(app => ({
    titulo: tituloBonito(app.name),
    subtitulo: app.name,
    url: PAGES_BASE + encodeURIComponent(app.name)
  }));
  const extraApps = APPS_EXTRAS.map(app => ({
    titulo: app.titulo,
    subtitulo: app.url ? app.url.replace(/^https?:\/\//, '') : app.path,
    url: app.url || (PAGES_BASE + app.path.split('/').map(encodeURIComponent).join('/'))
  }));

  const todosCombinados = [...autoApps, ...extraApps]
    .sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));

  const filtrados = todosCombinados.filter(app =>
    !termo ||
    app.titulo.toLowerCase().includes(termo) ||
    app.subtitulo.toLowerCase().includes(termo)
  );

  gridEl.innerHTML = '';
  vazioEl.style.display = filtrados.length === 0 ? 'block' : 'none';

  for (const app of filtrados) {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => window.open(app.url, '_blank');

    const icone = document.createElement('div');
    icone.className = 'icone';
    icone.style.background = corParaNome(app.titulo);
    icone.textContent = (app.titulo.charAt(0) || '?').toUpperCase();

    const titulo = document.createElement('div');
    titulo.className = 'titulo';
    titulo.textContent = app.titulo;

    const nomearq = document.createElement('div');
    nomearq.className = 'nomearq';
    nomearq.textContent = app.subtitulo;

    card.appendChild(icone);
    card.appendChild(titulo);
    card.appendChild(nomearq);
    gridEl.appendChild(card);
  }
}

inputBusca.addEventListener('input', renderizar);

btnAtualizar.addEventListener('click', async () => {
  btnAtualizar.disabled = true;
  btnAtualizar.innerHTML = '<span class="girando">🔄</span> Buscando...';
  await buscarApps();
  btnAtualizar.disabled = false;
  btnAtualizar.innerHTML = '🔄 Atualizar';
});

buscarApps();
setInterval(buscarApps, REFRESH_MS);
</script>

</body>
</html>
