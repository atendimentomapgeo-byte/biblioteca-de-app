<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map GEO Verificação Topológica</title>
<meta name="app-name" content="Map GEO Verificação Topológica">
<meta name="app-version" content="0.0.20">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f6f8;--pn:#fff;--tx:#1d2733;--mt:#6a7684;--bd:#d9dfe6;--ac:#0f6e56;--ac2:#e8f4f0;--er:#c0392b;--wn:#c77d0a;--ok:#1e8449}
@media (prefers-color-scheme:dark){:root{--bg:#12171c;--pn:#1b222a;--tx:#e6ebf0;--mt:#93a0ae;--bd:#2c3641;--ac:#3fbf9a;--ac2:#18312b;--er:#ec7063;--wn:#e0a13a;--ok:#58c27d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd)}
header h1{font-size:16px;margin:0;font-weight:650}
.ver{font-size:12px;color:var(--ac);background:var(--ac2);padding:2px 8px;border-radius:99px;cursor:pointer;border:0}
header .sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--pn);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
main{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
aside{background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mt);margin:0 0 8px}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:16px;text-align:center;color:var(--mt)}
#drop.over{border-color:var(--ac);background:var(--ac2)}
#drop b{color:var(--tx)}
.lyr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
.lyr:last-child{border:0}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.lyr .n{flex:1;font-weight:550;overflow:hidden;text-overflow:ellipsis}
.lyr .c{color:var(--mt);font-size:12px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mt)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.er{color:var(--er);border-color:var(--er)}.tag.wn{color:var(--wn);border-color:var(--wn)}
.rule{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.rule label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.rule small{display:block;color:var(--mt)}
.empty{color:var(--mt);font-size:13px}
.empty.ok{color:var(--ok)}.empty.er{color:var(--er)}
[hidden]{display:none!important}
section.right{display:grid;grid-template-rows:1fr 280px;min-height:0;min-width:0}
#map{min-height:200px}
#res{border-top:1px solid var(--bd);background:var(--pn);overflow:auto;position:relative}
#res .bar{position:sticky;top:0;background:var(--pn);display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);z-index:2}
#res .bar .sp{flex:1}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:top}
th{color:var(--mt);font-weight:600}
tr.row{cursor:pointer}tr.row:hover{background:var(--ac2)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9999}
.dlg.on{display:flex}
.dlg .box{background:var(--pn);border-radius:12px;padding:20px;max-width:520px;width:calc(100% - 32px);max-height:80vh;overflow:auto}
.dlg h3{margin:0 0 10px}
.dlg li{margin-bottom:4px}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:42vh;border-right:0;border-bottom:1px solid var(--bd)}section.right{grid-template-rows:260px 260px}}
</style>
</head>
<body>
<header>
  <h1>Map GEO Verificação Topológica</h1>
  <button class="ver" id="verBtn" title="Histórico de versões">v0.0.20</button>
  <span class="sp"></span>
  <button id="dictBtn">Dicionário de camadas</button>
</header>
<main>
<aside>
  <div>
    <h2>1 · Camadas</h2>
    <div id="drop"><b>Arraste aqui</b> o .zip ou os arquivos .shp .dbf .prj<br><br><button class="pri" id="pick">Escolher arquivos</button>
    <input type="file" id="file" multiple accept=".zip,.shp,.dbf,.prj,.cpg,.shx" hidden></div>
    <div id="dirBox" style="margin-top:10px">
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pri" id="pickDir">Monitorar pasta</button><button id="reDir" hidden></button><button id="stopDir" hidden>Parar</button></div>
      <div id="dirst" class="empty" style="margin-top:6px">Escolha a pasta com os shapefiles descompactados. Alterações salvas nela são lidas automaticamente.</div>
      <label class="empty" style="display:block;margin-top:4px"><input type="checkbox" id="auto" checked> Reexecutar a verificação após cada atualização</label>
    </div>
    <div id="lyrs" style="margin-top:10px"></div>
  </div>
  <div>
    <h2>2 · Regras</h2>
    <div id="rules"></div>
    <label class="empty" style="display:block;margin:8px 0 4px">Tolerância de área (m²)<br><input id="tol" type="number" min="0" step="0.1" value="1" style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)"></label>
    <label class="empty" style="display:block;margin:0 0 4px">Tolerância de largura (m)<br><input id="wtol" type="number" min="0" step="0.01" value="0.1" style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)"></label>
    <label class="empty" style="display:block;margin:0 0 4px">Distância mínima entre vértices (m)<br><input id="vtol" type="number" min="0" step="0.01" value="0.1" style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)"></label>
    <button class="pri" id="run" disabled style="width:100%;margin-top:6px">Executar verificação</button>
  </div>
</aside>
<section class="right">
  <div id="map"></div>
  <div id="res"><div class="bar"><b>Resultados</b><span id="sum" class="empty">Nenhuma verificação executada.</span><span class="sp"></span><button id="csv" disabled>Exportar CSV</button></div><div id="tbl"></div></div>
</section>
</main>

<div class="dlg" id="dlgVer"><div class="box"><h3>Histórico de versões</h3><ul id="chg"></ul><button onclick="this.closest('.dlg').classList.remove('on')">Fechar</button></div></div>
<div class="dlg" id="dlgDict"><div class="box" style="max-width:760px"><h3>Dicionário de camadas</h3><div id="dictBody"></div><br><button onclick="this.closest('.dlg').classList.remove('on')">Fechar</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@6.1.0/dist/shp.min.js"></script>
<script>
"use strict";
/* ============ VERSÃO ============ */
const APP_VERSION = "0.0.20";
const CHANGELOG = [
  {v:"0.0.20", d:"2026-10-25", t:["GEO-02: mensagem única \"Ponto repetido, equidistância menor que 10 cm entre vértices\" (o valor acompanha a distância mínima configurada)."]},
  {v:"0.0.19", d:"2026-10-25", t:["Nova regra GEO-02: ponto repetido e vértices a menos de 10 cm um do outro dentro da mesma geometria, em todas as camadas de polígono.","Novo campo Distância mínima entre vértices (padrão 0,1 m)."]},
  {v:"0.0.18", d:"2026-10-25", t:["Sobreposições e saídas de limite que são apenas lascas finas (bordas compartilhadas com pequena diferença de vértice) deixam de ser apontadas.","Novo campo Tolerância de largura (padrão 0,1 m): só conta sobreposição que tenha ao menos essa largura."]},
  {v:"0.0.17", d:"2026-10-25", t:["Etapa 3 de regras: VER-01 (VEREDA contida em uma AIR e em AVN, AUAS ou AREA_CONSOLIDADA) e LAG-01 (ZONA da LAGOA_NATURAL = R ou U)."]},
  {v:"0.0.16", d:"2026-10-25", t:["Mensagem da data de abertura da AUAS: \"A data de abertura da AUAS deve ser igual ou superior a 01/08/2008.\""]},
  {v:"0.0.15", d:"2026-10-25", t:["AUAS: data mínima de ABERTURA alterada para 01/08/2008."]},
  {v:"0.0.14", d:"2026-10-25", t:["Monitoramento de pasta lê somente os shapefiles da pasta escolhida (sem subpastas).","Ao escolher ou reabrir uma pasta, as camadas carregadas antes são removidas."]},
  {v:"0.0.13", d:"2026-10-25", t:["As feições passam a ser identificadas somente pelo FID (posição na tabela, começando em 0)."]},
  {v:"0.0.12", d:"2026-10-25", t:["Furos deixam de ser apontados como geometria complexa; continuam sendo apontados multiparte, auto-interseção e anel externo anti-horário."]},
  {v:"0.0.11", d:"2026-10-25", t:["GEO-01 passa a apontar geometria complexa (multiparte e furos) em todas as camadas de polígono, não só na AIR."]},
  {v:"0.0.10", d:"2026-10-25", t:["Detecção de geometria complexa passa a ler o .shp bruto (partes, furos e sentido dos anéis), sem depender da interpretação da biblioteca.","Anel externo anti-horário (fora do padrão) é apontado.","GEO-01 também aponta geometria nula ou vazia em qualquer camada."]},
  {v:"0.0.9", d:"2026-10-25", t:["Pontos de toque repetidos são contados uma só vez. Aviso de toque entre anéis passa a distinguir \"Partes do multipolígono se tocam\" de \"Furo toca o contorno externo ou outro furo\"."]},
  {v:"0.0.8", d:"2026-10-25", t:["Correção da verificação de auto-interseção: detecção própria de cruzamento, toque do contorno e spike (antes só cruzamentos simples eram vistos).","Nova regra GEO-01 aplica a verificação a todas as camadas de polígono; a AIR continua em AIR-01.","Pontos problemáticos destacados no mapa."]},
  {v:"0.0.7", d:"2026-10-25", t:["Etapa 2 de regras: CON-01 (AREA_CONSOLIDADA) e AUAS-01 (posição e validação da data de ABERTURA, mínimo 22/07/2008)."]},
  {v:"0.0.6", d:"2026-10-25", t:["Descrição das sobreposições no formato \"ARL tipo P sobrepondo AREA_CONSOLIDADA\"; a área passa a ter coluna própria (e vai para o CSV)."]},
  {v:"0.0.5", d:"2026-10-25", t:["Mapas base: Satélite (padrão), Satélite com rótulos e Mapa de ruas, com seletor no mapa. A escolha fica lembrada."]},
  {v:"0.0.4", d:"2026-10-25", t:["Coluna Feição passa a mostrar o FID (posição na tabela, começando em 0, como no ArcGIS) junto com o ID, para distinguir feições com ID repetido."]},
  {v:"0.0.3", d:"2026-10-25", t:["Monitoramento de pasta: a ferramenta lê os shapefiles descompactados de uma pasta e recarrega sozinha as camadas que forem alteradas (Chrome/Edge).","Opção de reexecutar a verificação automaticamente a cada atualização.","A pasta escolhida é lembrada para a próxima abertura."]},
  {v:"0.0.2", d:"2026-10-25", t:["Etapa 1 de regras: TOP-01 (feições dentro da ATP, exceto rios), AIR-01, AVN-01 e ARL-01.","Tolerância de área configurável (padrão 1 m²) para ignorar fragmentos de digitalização.","Resultados com destaque no mapa da área sobreposta ou fora do limite."]},
  {v:"0.0.1", d:"2026-10-25", t:["Versão inicial.","Dicionário de dados com 28 camadas e seus campos (a partir do arquivo modelo).","Carregamento de shapefiles (.zip ou arquivos soltos), mapa e tabela de resultados.","Conferência de estrutura (camadas, campos, tipo de geometria e SIRGAS 2000).","Estrutura de módulos pronta para receber as regras topológicas."]}
];

/* ============ DICIONÁRIO ============ */
// g: P = polígono, PT = ponto. f: [nome, tipo (N número, C texto, D data), tamanho, casas]
const T = (n,l=254)=>[n,"C",l,0];
const DICT = {
  AIR:{g:"P",f:[["ID","N",18,0],T("TIPO"),T("IDENTIFIC")]},
  AREA_ALTITUDE_1800:{g:"P",f:[["ID","N",18,0]]},
  AREA_CONSOLIDADA:{g:"P",f:[["ID","N",18,0]]},
  AREA_DECLIVIDADE:{g:"P",f:[["ID","N",18,0],T("INCLINACAO")]},
  AREA_TOPO_MORRO:{g:"P",f:[["ID","N",18,0]]},
  AREA_UMIDA:{g:"P",f:[["ID","N",18,0]]},
  AREA_USO_RESTRITO:{g:"P",f:[["ID","N",18,0],T("TIPO")]},
  ARL:{g:"P",f:[["ID","N",18,0],T("IDENTIFIC"),T("AVERBACAO"),T("SITUACAO")]},
  ARLREM:{g:"P",f:[["ID","N",18,0]]},
  ATP:{g:"P",f:[["ID","N",18,0]]},
  AUAS:{g:"P",f:[["ID","N",18,0],["ABERTURA","D",8,0]]},
  AURD:{g:"P",f:[["ID","N",18,0],T("ORIGEM"),T("SOBREPOE")]},
  AVN:{g:"P",f:[["ID","N",18,0],T("SITUACAO")]},
  BORDA_CHAPADA:{g:"P",f:[["ID","N",18,0]]},
  INTERESSE_SOCIAL:{g:"P",f:[["ID","N",18,0],T("FINALIDADE"),T("DETALHES")]},
  LAGOA_NATURAL:{g:"P",f:[["ID","N",18,0],T("ZONA"),T("NOME")]},
  MANGUEZAL:{g:"P",f:[["ID","N",18,0]]},
  NASCENTE:{g:"PT",f:[["ID","N",18,0]]},
  RESERVATORIO_ARTIFICIAL:{g:"P",f:[["ID","N",18,0],T("ZONA"),T("BARRAMENTO"),T("OBJETIVO"),T("SITUACAO"),["FAIXA_APP","N",18,4],T("NOME")]},
  RESTINGA:{g:"P",f:[["ID","N",18,0]]},
  RIO_ATE_10:{g:"P",grupo:"RIOS",f:[["ID","N",18,0],T("NOME")]},
  RIO_10_A_50:{g:"P",grupo:"RIOS",f:[["ID","N",18,0],T("NOME")]},
  RIO_50_A_200:{g:"P",grupo:"RIOS",f:[["ID","N",18,0],T("NOME")]},
  RIO_200_A_600:{g:"P",grupo:"RIOS",f:[["ID","N",18,0],T("NOME")]},
  RIO_ACIMA_600:{g:"P",grupo:"RIOS",f:[["ID","N",18,0],T("NOME")]},
  TIPOLOGIA_VEGETAL:{g:"P",f:[["ID","N",18,0],T("TIPO")]},
  UTILIDADE_PUBLICA:{g:"P",f:[["ID","N",18,0],T("FINALIDADE"),T("DETALHES")]},
  VEREDA:{g:"P",f:[["ID","N",18,0]]}
};
const TIPO_NOME = {N:"número",C:"texto",D:"data"};

/* ============ ESTADO ============ */
const LAYERS = {};      // nome -> {name, fc (GeoJSON), fields[], prj, leaflet, color}
const COLORS = ["#0f6e56","#c0392b","#2874a6","#b9770e","#7d3c98","#117a65","#a93226","#1f618d","#9c640c","#6c3483","#148f77","#cb4335","#2e86c1","#d68910","#884ea0","#17a589","#e74c3c","#3498db","#f39c12","#9b59b6"];
let RESULTS = [];
let SIGS = {}, PEND = {}, ERRS = {};

/* ============ REGRAS ============ */
// Cada regra: {id, nome, desc, run(ctx) -> [{camada, fid, msg, sev, geom?}]}
// ctx: {layers, dict, get(nome) -> camada | undefined}
// Novas regras entram nesta lista, sem mexer no resto do app.
const RULES = [
  {
    id:"EST-01", nome:"Conferência de estrutura",
    desc:"Camadas, campos, tipo de geometria e SIRGAS 2000 conforme o dicionário.",
    on:true,
    run(ctx){
      const out=[];
      for(const L of Object.values(ctx.layers)){
        const d=ctx.dict[L.name];
        if(!d){ out.push({camada:L.name,msg:"Camada não consta no dicionário.",sev:"aviso"}); continue; }
        const have=new Map(L.fields.map(f=>[f.n.toUpperCase(),f]));
        for(const [n,t,l,dc] of d.f){
          const f=have.get(n);
          if(!f) out.push({camada:L.name,msg:`Campo ausente: ${n}.`,sev:"erro"});
          else if(f.t!==t) out.push({camada:L.name,msg:`Campo ${n}: tipo ${TIPO_NOME[f.t]||f.t}, esperado ${TIPO_NOME[t]}.`,sev:"erro"});
        }
        const exp=new Set(d.f.map(x=>x[0]));
        for(const f of L.fields) if(!exp.has(f.n.toUpperCase())) out.push({camada:L.name,msg:`Campo fora do dicionário: ${f.n}.`,sev:"aviso"});
        if(L.gtype!==null){
          const ok=d.g==="PT"?/Point/.test(L.gtype):/Polygon/.test(L.gtype);
          if(!ok) out.push({camada:L.name,msg:`Geometria ${L.gtype}, esperado ${d.g==="PT"?"ponto":"polígono"}.`,sev:"erro"});
        }
        if(!L.prj) out.push({camada:L.name,msg:"Sem arquivo .prj (sistema de coordenadas desconhecido).",sev:"aviso"});
        else if(!/SIRGAS/i.test(L.prj)) out.push({camada:L.name,msg:"Sistema de coordenadas diferente de SIRGAS 2000.",sev:"erro"});
      }
      return out;
    }
  },
  /* ---------- Etapa 1 ---------- */
  {
    id:"GEO-01", nome:"Geometria sem auto-interseção",
    desc:"Em todas as camadas de polígono: geometria complexa (multiparte), nula/vazia, cruzamento, toque e retorno sobre si mesmo. A AIR é conferida na regra AIR-01.",
    on:true,
    async run(ctx){
      const out=[];
      for(const n of Object.keys(ctx.layers)){
        ctx.layers[n].fc.features.forEach(f=>{ const g=f.geometry; if(!g||(g.coordinates&&!g.coordinates.length)) out.push({camada:n,fid:H.id(f),msg:"Geometria nula ou vazia.",sev:"erro"}); });
        if(n==="AIR"||(DICT[n]&&DICT[n].g==="PT")) continue;
        for(const f of H.feats(ctx,n)){
          await H.tick();
          for(const m of H.complexa(f)) out.push({camada:n,fid:H.id(f),msg:"Geometria complexa: "+m+".",sev:"erro",geom:f.geometry});
          out.push(...H.autoRes(n,f));
        }
      }
      return out;
    }
  },
  {
    id:"GEO-02", nome:"Vértices repetidos ou muito próximos",
    desc:"Em todas as camadas de polígono (inclusive AIR): ponto repetido e vértices a menos da distância mínima um do outro, dentro da mesma geometria.",
    on:true,
    async run(ctx){
      const out=[], dm=ctx.vtol, cm=(dm*100).toLocaleString("pt-BR",{maximumFractionDigits:2});
      for(const n of Object.keys(ctx.layers)){
        if(DICT[n]&&DICT[n].g==="PT") continue;
        for(const f of H.feats(ctx,n)){
          await H.tick();
          const r=H.vertsProx(f,dm), id=H.id(f), pts=l=>turf.featureCollection(l.map(c=>turf.point(c)));
          const todos=r.rep.concat(r.prox);
          if(todos.length) out.push({camada:n,fid:id,msg:`Ponto repetido, equidistância menor que ${cm} cm entre vértices`,sev:"erro",geom:pts(todos)});
        }
      }
      return out;
    }
  },
  {
    id:"TOP-01", nome:"Feições dentro da ATP",
    desc:"Toda geometria deve estar contida em uma ATP. Exceção: as camadas de rios.",
    on:true,
    async run(ctx){
      const out=[], atp=H.feats(ctx,"ATP");
      const alvo=Object.keys(ctx.layers).filter(n=>n!=="ATP"&&!RIOS.includes(n)&&H.feats(ctx,n).length);
      if(!alvo.length) return out;
      if(!atp.length){ out.push({camada:"ATP",msg:"Camada ATP vazia ou não carregada: não é possível verificar o contorno.",sev:"erro"}); return out; }
      for(const n of alvo) for(const f of H.feats(ctx,n)){
        await H.tick();
        let melhor=Infinity, geom=null;
        for(const a of atp){
          const o=H.outside(f,a); if(o.area<melhor){melhor=o.area;geom=o.geom;}
          if(melhor<=ctx.tol) break;
        }
        if(melhor>ctx.tol) out.push({camada:n,fid:H.id(f),msg:`Não está contida em uma única ATP (${H.m2(melhor)} fora).`,sev:"erro",geom:geom||f.geometry});
      }
      return out;
    }
  },
  {
    id:"AIR-01", nome:"AIR: geometria e atributos",
    desc:"Geometria simples (sem auto-interseção nem partes múltiplas; furos são permitidos). TIPO = P ou M. IDENTIFIC = POSSE (P) ou número (M). Sem campos vazios.",
    on:true,
    async run(ctx){
      const out=[];
      for(const f of H.feats(ctx,"AIR")){
        await H.tick(); const id=H.id(f), p=f.properties||{};
        for(const m of H.complexa(f)) out.push({camada:"AIR",fid:id,msg:"Geometria complexa: "+m+".",sev:"erro",geom:f.geometry});
        out.push(...H.autoRes("AIR",f));
        const tipo=p.TIPO, ident=p.IDENTIFIC;
        if(H.vazio(tipo)) out.push({camada:"AIR",fid:id,msg:"TIPO vazio.",sev:"erro"});
        else if(tipo!=="P"&&tipo!=="M") out.push({camada:"AIR",fid:id,msg:`TIPO "${tipo}" inválido (esperado P ou M maiúsculo).`,sev:"erro"});
        if(H.vazio(ident)) out.push({camada:"AIR",fid:id,msg:"IDENTIFIC vazio.",sev:"erro"});

const RIOS=["RIO_ATE_10","RIO_10_A_50","RIO_50_A_200","RIO_200_A_600","RIO_ACIMA_600"];
/* ---------- utilitários geométricos ---------- */
const H={
  W:0,
  tick:()=>new Promise(r=>setTimeout(r,0)),
  // descarta fragmentos finos (lascas): resto do polígono depois de erodir W metros
  grosso(g){
    if(!(H.W>0)) return true;
    try{ const b=turf.buffer(g,-H.W,{units:"meters"}); return !!(b&&b.geometry&&b.geometry.coordinates&&b.geometry.coordinates.length&&turf.area(b)>0); }
    catch(e){ return true; }
  },
  feats:(ctx,n)=>(ctx.layers[n]?ctx.layers[n].fc.features:[]).filter(f=>f.geometry),
  id:f=>"FID "+f._i,
  vazio:v=>v==null||String(v).trim()==="",
  data(v){
    if(v==null||v==="") return {vazio:true};
    if(v instanceof Date) return isNaN(v)?{vazio:true}:{date:v};
    const t=String(v).trim(); if(!t) return {vazio:true};
    let m=t.match(/^(\d{4})-?(\d{2})-?(\d{2})/)||null, y,mo,d;
    if(m){ y=+m[1];mo=+m[2];d=+m[3]; }
    else if((m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/))){ d=+m[1];mo=+m[2];y=+m[3]; }
    else return {raw:t};
    const dt=new Date(y,mo-1,d);
    return (dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)?{date:dt}:{raw:t};
  },
  m2:a=>a.toLocaleString("pt-BR",{maximumFractionDigits:2})+" m²",
  bb(f){ return f._bb||(f._bb=turf.bbox(f)); },
  disj(a,b){ const x=H.bb(a),y=H.bb(b); return x[0]>y[2]||y[0]>x[2]||x[1]>y[3]||y[1]>x[3]; },
  // área de a que fica fora de b
  outside(a,b){
    try{
      if(H.disj(a,b)) return {area:turf.area(a),geom:a.geometry};
      const d=turf.difference(turf.featureCollection([a,b]));
      if(!d) return {area:0,geom:null};
      const ar=turf.area(d);
      return (ar>0&&!H.grosso(d))?{area:0,geom:null}:{area:ar,geom:d.geometry};
    }catch(e){ return {area:turf.area(a),geom:a.geometry}; }
  },
  // área de a que sobrepõe as feições de lista
  inter(a,lista,tol){
    let area=0; const gs=[];
    for(const b of lista){
      if(H.disj(a,b)) continue;
      try{ const i=turf.intersect(turf.featureCollection([a,b])); if(i){const ar=turf.area(i); if(ar>tol&&H.grosso(i)){area+=ar;gs.push(i);}} }catch(e){}
    }
    return {area,geom:gs.length?turf.featureCollection(gs):null};
  },
  sobrepoe(ctx,nome,f,camadas,rotulo){
    const out=[];
    for(const c of camadas){
      const r=H.inter(f,H.feats(ctx,c),ctx.tol);
      if(r.area) out.push({camada:nome,fid:H.id(f),msg:`${rotulo||nome} sobrepondo ${c}`,area:r.area,sev:"erro",geom:r.geom});
    }
    return out;
  },
  // contida em uma única AIR e sem sobrepor as demais
  emAir(ctx,nome,f){
    const air=H.feats(ctx,"AIR"), out=[], id=H.id(f);
    if(!air.length) return [{camada:nome,fid:id,msg:"Camada AIR vazia ou não carregada: não é possível verificar.",sev:"erro"}];
    let dentro=-1, melhor=Infinity, geom=null;
    air.forEach((a,i)=>{ const o=H.outside(f,a); if(o.area<melhor){melhor=o.area;geom=o.geom;dentro=i;} });
    if(melhor>ctx.tol) out.push({camada:nome,fid:id,msg:`Não está contida em uma única AIR (${H.m2(melhor)} fora da AIR mais próxima).`,sev:"erro",geom:geom||f.geometry});
    air.forEach((a,i)=>{
      if(i===dentro&&melhor<=ctx.tol) return;
      const r=H.inter(f,[a],ctx.tol);
      if(r.area) out.push({camada:nome,fid:id,msg:`Sobrepõe outra AIR (${H.id(a)}, ${H.m2(r.area)}).`,sev:"erro",geom:r.geom});
    });
    return out;
  },
  vertsProx(f,dm){
    const g=f.geometry, polys=g.type==="MultiPolygon"?g.coordinates:g.type==="Polygon"?[g.coordinates]:[], pts=[], out={rep:[],prox:[]};
    polys.forEach(poly=>poly.forEach(ring=>{
      const n=ring.length, fim=(n>1&&ring[0][0]===ring[n-1][0]&&ring[0][1]===ring[n-1][1])?n-1:n;
      for(let i=0;i<fim;i++) pts.push(ring[i]);
    }));
    if(pts.length<2) return out;
    const kx=111320*Math.cos(pts[0][1]*Math.PI/180), ky=110574, lim=Math.max(dm,0.001), cell=lim, grid=new Map();
    const P=pts.map(c=>[c[0]*kx,c[1]*ky]);
    P.forEach((q,i)=>{
      const cx=Math.floor(q[0]/cell), cy=Math.floor(q[1]/cell);
      for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){
        const l=grid.get((cx+a)+","+(cy+b)); if(!l) continue;
        for(const j of l){ const d=Math.hypot(q[0]-P[j][0],q[1]-P[j][1]); if(d<0.001) out.rep.push(pts[i]); else if(d<dm) out.prox.push(pts[i]); }
      }
      const k=cx+","+cy; (grid.get(k)||grid.set(k,[]).get(k)).push(i);
    });
    return out;
  },
  autoint(f){
    const g=f.geometry, E=1e-9, out={cruza:[],toca:[],tocaAneis:[],tocaPartes:[],spike:[]};
    const polys=g.type==="MultiPolygon"?g.coordinates:g.type==="Polygon"?[g.coordinates]:[];
    const segs=[]; let rid=0;
    const or=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
    const dps=(p,a,b)=>{ const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy; let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy); };
    polys.forEach((poly,pi)=>poly.forEach(ring=>{
      const pts=[]; for(const q of ring){ const l=pts[pts.length-1]; if(l&&Math.abs(l[0]-q[0])<1e-12&&Math.abs(l[1]-q[1])<1e-12) continue; pts.push(q); }
      const n=pts.length-1; if(n<3) return;
      for(let i=0;i<n;i++){ const a=pts[i],b=pts[i+1]; segs.push({a,b,r:rid,pl:pi,i,n,x0:Math.min(a[0],b[0]),x1:Math.max(a[0],b[0]),y0:Math.min(a[1],b[1]),y1:Math.max(a[1],b[1])}); }
      for(let i=0;i<n;i++){
        const p=pts[i],q=pts[(i+1)%n],r=pts[(i+2)%n];
        const ux=q[0]-p[0],uy=q[1]-p[1],vx=r[0]-q[0],vy=r[1]-q[1], cr=ux*vy-uy*vx, dt=ux*vx+uy*vy;
        if(dt<0&&Math.abs(cr)<=1e-9*Math.hypot(ux,uy)*Math.hypot(vx,vy)) out.spike.push(q);
      }
      rid++;
    }));
    segs.sort((s,t)=>s.x0-t.x0);
    for(let i=0;i<segs.length;i++){
      const s=segs[i];
      for(let j=i+1;j<segs.length&&segs[j].x0<=s.x1+E;j++){
        const t=segs[j];
        if(t.y0>s.y1+E||t.y1<s.y0-E) continue;
        const mesmo=s.r===t.r;
        if(mesmo){ const d=Math.abs(s.i-t.i); if(d===1||d===s.n-1) continue; }
        const o1=or(t.a,t.b,s.a),o2=or(t.a,t.b,s.b),o3=or(s.a,s.b,t.a),o4=or(s.a,s.b,t.b);
        if(o1*o2<0&&o3*o4<0){ const k=o1/(o1-o2); out.cruza.push([s.a[0]+(s.b[0]-s.a[0])*k,s.a[1]+(s.b[1]-s.a[1])*k]); continue; }
        let pt=null;
        if(dps(s.a,t.a,t.b)<=E) pt=s.a; else if(dps(s.b,t.a,t.b)<=E) pt=s.b; else if(dps(t.a,s.a,s.b)<=E) pt=t.a; else if(dps(t.b,s.a,s.b)<=E) pt=t.b;
        if(pt) (mesmo?out.toca:(s.pl===t.pl?out.tocaAneis:out.tocaPartes)).push(pt);
      }
    }
    return out;
  },
  autoRes(nome,f){
    const un=l=>{ const m=new Map(); l.forEach(c=>m.set(c[0].toFixed(8)+","+c[1].toFixed(8),c)); return [...m.values()]; };
    let a; try{ a=H.autoint(f); }catch(e){ return [{camada:nome,fid:H.id(f),msg:"Falha ao verificar auto-interseção: "+e.message,sev:"aviso"}]; }
    const id=H.id(f), pts=l=>turf.featureCollection(l.map(c=>turf.point(c))), out=[];
    for(const k of Object.keys(a)) a[k]=un(a[k]);
    if(a.cruza.length) out.push({camada:nome,fid:id,msg:`Auto-interseção (${a.cruza.length} ponto(s)).`,sev:"erro",geom:pts(a.cruza)});
    if(a.toca.length) out.push({camada:nome,fid:id,msg:`Auto-toque: o contorno toca a si mesmo (${a.toca.length} ponto(s)).`,sev:"erro",geom:pts(a.toca)});
    if(a.spike.length) out.push({camada:nome,fid:id,msg:`Retorno sobre si mesmo / spike (${a.spike.length} ponto(s)).`,sev:"erro",geom:pts(a.spike)});
    if(a.tocaPartes.length) out.push({camada:nome,fid:id,msg:`Partes do multipolígono se tocam (${a.tocaPartes.length} ponto(s)).`,sev:"aviso",geom:pts(a.tocaPartes)});
    if(a.tocaAneis.length) out.push({camada:nome,fid:id,msg:`Furo toca o contorno externo ou outro furo (${a.tocaAneis.length} ponto(s)).`,sev:"aviso",geom:pts(a.tocaAneis)});
    return out;
  },
  complexa(f){
    const g=f.geometry, m=[], r=f._raw;
    if(r&&r.rings.length){
      const ext=r.rings.filter(x=>x.cw).length, fur=r.rings.length-ext;
      if(!r.rings[0].cw){ m.push("anel externo em sentido anti-horário (fora do padrão do shapefile)"); if(r.rings.length>1) m.push(`${r.rings.length} anéis`); return m; }
      if(ext>1) m.push(`multiparte (${ext} partes)`);
      return m;
    }
    if(g.type==="MultiPolygon"&&g.coordinates.length>1) m.push(`multiparte (${g.coordinates.length} partes)`);
    const polys=g.type==="MultiPolygon"?g.coordinates:[g.coordinates];
    return m;
  }
};

/* ============ LEITURA ============ */
function dbfHeader(buf){
  const dv=new DataView(buf), out=[]; let p=32;
  const dec=new TextDecoder("latin1");
  while(p<dv.byteLength && dv.getUint8(p)!==0x0D){
    const nm=dec.decode(new Uint8Array(buf,p,11)).split("\0")[0];
    out.push({n:nm,t:String.fromCharCode(dv.getUint8(p+11)),l:dv.getUint8(p+16)});
    p+=32;
  }
  return out;
}
async function collect(files){
  const groups={}; // base -> {shp,dbf,prj,cpg}
  const add=(name,buf)=>{
    const m=name.match(/([^\/\\]+)\.(shp|dbf|prj|cpg)$/i); if(!m) return;
    const b=m[1].toUpperCase(); (groups[b]=groups[b]||{})[m[2].toLowerCase()]=buf;
  };
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      for(const e of Object.values(z.files)) if(!e.dir && !/__MACOSX/.test(e.name)) add(e.name,await e.async("arraybuffer"));
    } else add(f.name,await f.arrayBuffer());
  }
  return groups;
}
// Lê o .shp bruto: nº de anéis e sentido (horário = externo, anti-horário = furo), na ordem dos registros.
function rawRings(buf){
  const dv=new DataView(buf), out=[]; let p=100;
  while(p+8<=dv.byteLength){
    const len=dv.getInt32(p+4,false)*2, c=p+8; p=c+len;
    if(len<4){ out.push(null); continue; }
    const t=dv.getInt32(c,true);
    if(![5,15,25].includes(t)){ out.push(null); continue; }
    const np=dv.getInt32(c+36,true), npt=dv.getInt32(c+40,true), parts=[];
    for(let i=0;i<np;i++) parts.push(dv.getInt32(c+44+4*i,true));
    const pts=c+44+4*np, rings=[];
    for(let i=0;i<np;i++){
      const a=parts[i], b=i+1<np?parts[i+1]:npt; let ar=0;
      for(let k=a;k<b-1;k++){ const x1=dv.getFloat64(pts+16*k,true),y1=dv.getFloat64(pts+16*k+8,true),x2=dv.getFloat64(pts+16*(k+1),true),y2=dv.getFloat64(pts+16*(k+1)+8,true); ar+=(x1*y2-x2*y1); }
      rings.push({n:b-a,cw:ar<0});
    }
    out.push({rings});
  }
  return out;
}
async function load(files){ return ingest(await collect(files),{fit:true}); }
async function ingest(groups,opt={}){
  let n=0;
  for(const [name,g] of Object.entries(groups)){
    if(!g.shp||!g.dbf) continue;
    try{
      const prj=g.prj?new TextDecoder().decode(g.prj):"";
      const cpg=g.cpg?new TextDecoder().decode(g.cpg).trim():undefined;
      const geoms=shp.parseShp(g.shp,prj||undefined);
      const data=shp.parseDbf(g.dbf,cpg);
      const fc=shp.combine([geoms,data]);
      const feats=fc.features||[];
      const gtype=feats.length?feats[0].geometry&&feats[0].geometry.type:null;
      let raw=[]; try{ raw=rawRings(g.shp); }catch(e){}
      feats.forEach((f,i)=>{ f._i=i; if(raw[i]) f._raw=raw[i]; });
      const old=LAYERS[name];
      if(old&&old.leaflet) old.leaflet.remove();
      LAYERS[name]={name,fc:{type:"FeatureCollection",features:feats},fields:dbfHeader(g.dbf),prj,gtype,color:old?old.color:COLORS[Object.keys(LAYERS).length%COLORS.length]};
      drawLayer(LAYERS[name]); delete ERRS[name]; n++;
    }catch(e){ console.error(name,e); ERRS[name]=e.message||String(e); delete SIGS[name]; }
  }
  renderLayers(); if(opt.fit) fit();
  $("run").disabled=!Object.keys(LAYERS).length;
  return n;
}

/* ============ PASTA MONITORADA ============ */
const HAS_DIR=typeof window.showDirectoryPicker==="function";
let DIR=null, POLL=null, BUSY=false;
const idb=(mode,fn)=>new Promise((res,rej)=>{
  const q=indexedDB.open("mapgeo-vt",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("kv");
  q.onerror=()=>rej(q.error);
  q.onsuccess=()=>{ try{ const tx=q.result.transaction("kv",mode), r=fn(tx.objectStore("kv")); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); }catch(e){ rej(e); } };
});
const saveHandle=h=>idb("readwrite",s=>s.put(h,"dir")).catch(()=>{});
const getHandle=()=>idb("readonly",s=>s.get("dir")).catch(()=>null);
async function listDir(h,depth=0,out=[]){
  for await(const [name,e] of h.entries()){
    if(e.kind==="file"){ if(/\.(shp|dbf|prj|cpg)$/i.test(name)) out.push(e); }
    
  }
  return out;
}
function dirMsg(t,cls){ const e=$("dirst"); e.className="empty "+(cls||""); e.textContent=t; }
async function scan(first){
  if(BUSY||!DIR) return; BUSY=true;
  try{
    const cur={};
    for(const h of await listDir(DIR)){
      const f=await h.getFile(), m=f.name.match(/^(.*)\.(shp|dbf|prj|cpg)$/i); if(!m) continue;
      (cur[m[1].toUpperCase()]=cur[m[1].toUpperCase()]||{})[m[2].toLowerCase()]=f;
    }
    const changed=[];
    for(const [b,g] of Object.entries(cur)){
      if(!g.shp||!g.dbf) continue;
      const sig=["shp","dbf","prj","cpg"].map(k=>g[k]?g[k].lastModified+":"+g[k].size:"-").join("|");
      if(SIGS[b]===sig){ delete PEND[b]; continue; }
      if(first||PEND[b]===sig){ changed.push([b,g,sig]); delete PEND[b]; } else PEND[b]=sig; // espera o arquivo estabilizar
    }
    const gone=Object.keys(SIGS).filter(b=>!cur[b]||!cur[b].shp||!cur[b].dbf);
    gone.forEach(b=>{ delete SIGS[b]; if(LAYERS[b]){ if(LAYERS[b].leaflet) LAYERS[b].leaflet.remove(); delete LAYERS[b]; } });
    let n=0;
    if(changed.length){
      const groups={};
      for(const [b,g,sig] of changed){ const o={}; for(const k of Object.keys(g)) o[k]=await g[k].arrayBuffer(); groups[b]=o; SIGS[b]=sig; }
      n=await ingest(groups,{fit:first&&!Object.keys(LAYERS).some(x=>!groups[x])});
    } else if(gone.length){ renderLayers(); $("run").disabled=!Object.keys(LAYERS).length; }
    if(first&&changed.length) fit();
    const hora=new Date().toLocaleTimeString("pt-BR");
    dirMsg(`Pasta "${DIR.name}" · monitorando · ${Object.keys(cur).filter(b=>cur[b].shp).length} shapefile(s) · lido às ${hora}`,"ok");
    if(!first&&(n||gone.length)){
      dirMsg(`Pasta "${DIR.name}" · atualizado às ${hora}: ${[...changed.map(c=>c[0]),...gone.map(g=>g+" (removida)")].join(", ")}`,"ok");
      if($("auto").checked&&Object.keys(LAYERS).length) run();
    }
  }catch(e){ console.error(e); dirMsg("Erro ao ler a pasta: "+e.message+". Clique em 'Reabrir pasta' se a permissão foi perdida.","er"); }
  finally{ BUSY=false; }
}
function clearLayers(){
  Object.values(LAYERS).forEach(l=>{ if(l.leaflet) l.leaflet.remove(); });
  for(const k of Object.keys(LAYERS)) delete LAYERS[k];
  for(const k of Object.keys(ERRS)) delete ERRS[k];
  RESULTS=[]; showResults(); renderLayers(); $("run").disabled=true;
}
async function startWatch(h){
  clearLayers();
  DIR=h; SIGS={}; PEND={}; clearInterval(POLL);
  $("stopDir").hidden=false; $("reDir").hidden=true;
  await scan(true);
  POLL=setInterval(()=>scan(false),2000);
}
function stopWatch(){ clearInterval(POLL); POLL=null; DIR=null; SIGS={}; PEND={}; $("stopDir").hidden=true; dirMsg("Monitoramento parado. As camadas carregadas continuam na tela."); }
async function pickDir(){
  let h; try{ h=await window.showDirectoryPicker({mode:"read"}); }catch(e){ return; }
  saveHandle(h); startWatch(h);
}
async function reopenDir(){
  const h=await getHandle(); if(!h) return;
  if(await h.requestPermission({mode:"read"})==="granted") startWatch(h); else dirMsg("Permissão negada para a pasta.","er");
}
async function initDir(){
  if(!HAS_DIR){ $("dirBox").innerHTML='<div class="empty">Monitorar pasta exige Chrome ou Edge.</div>'; return; }
  const h=await getHandle(); if(!h) return;
  try{ if(await h.queryPermission({mode:"read"})==="granted"){ startWatch(h); return; } }catch(e){}
  $("reDir").hidden=false; $("reDir").textContent=`Reabrir pasta "${h.name}"`;
}

/* ============ MAPA ============ */
const $=id=>document.getElementById(id);
const map=L.map("map",{preferCanvas:true}).setView([-13.5,-56],5);
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
const BASES={
  "Satélite":L.tileLayer(ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:21,maxNativeZoom:19,attribution:"Imagem © Esri, Maxar, Earthstar Geographics"}),
  "Satélite com rótulos":L.layerGroup([
    L.tileLayer(ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:21,maxNativeZoom:19,attribution:"Imagem © Esri, Maxar, Earthstar Geographics"}),
    L.tileLayer(ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:21,maxNativeZoom:19})]),
  "Mapa de ruas (OSM)":L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:21,maxNativeZoom:19,attribution:"© OpenStreetMap"})
};
let baseSel="Satélite"; try{ baseSel=localStorage.getItem("vt-base")||baseSel; }catch(e){}
if(!BASES[baseSel]) baseSel="Satélite";
BASES[baseSel].addTo(map);
L.control.layers(BASES,null,{position:"topright",collapsed:true}).addTo(map);
map.on("baselayerchange",e=>{ try{ localStorage.setItem("vt-base",e.name); }catch(_){} });
let hl=null;
function drawLayer(l){
  if(!l.fc.features.length){ l.leaflet=null; return; }
  l.leaflet=L.geoJSON(l.fc,{style:{color:l.color,weight:1.5,fillOpacity:.25},pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:l.color,fillOpacity:.8}),
    onEachFeature:(f,ly)=>ly.bindPopup(`<b>${l.name}</b><br>`+Object.entries(f.properties||{}).map(([k,v])=>`${k}: ${v??""}`).join("<br>"))}).addTo(map);
}
function fit(){
  const bs=Object.values(LAYERS).filter(l=>l.leaflet).map(l=>l.leaflet.getBounds());
  if(bs.length){ let b=bs[0]; bs.slice(1).forEach(x=>b.extend(x)); map.fitBounds(b,{padding:[30,30]}); }
}

/* ============ INTERFACE ============ */
function renderLayers(){
  const names=Object.keys(LAYERS).sort();
  $("lyrs").innerHTML=names.length?names.map(n=>{
    const l=LAYERS[n], k=DICT[n]?"":'<span class="tag wn">fora do dicionário</span>';
    return `<div class="lyr"><span class="sw" style="background:${l.color}"></span><span class="n" title="${n}">${n}</span>${k}<span class="c">${l.fc.features.length} reg.</span></div>`;
  }).join(""):'<div class="empty">Nenhuma camada carregada.</div>';
  Object.entries(ERRS).forEach(([n,m])=>$("lyrs").insertAdjacentHTML("afterbegin",`<div class="empty er">Falha ao ler ${n}: ${m}</div>`));
  const falt=Object.keys(DICT).filter(k=>!LAYERS[k]);
  if(names.length&&falt.length) $("lyrs").insertAdjacentHTML("beforeend",`<div class="empty" style="margin-top:8px">Do dicionário, não carregadas (${falt.length}): ${falt.join(", ")}</div>`);
}
function renderRules(){
  $("rules").innerHTML=RULES.map(r=>`<div class="rule"><label><input type="checkbox" data-r="${r.id}" ${r.on?"checked":""}><span><b>${r.nome}</b><small>${r.desc}</small></span></label></div>`).join("");
  $("rules").insertAdjacentHTML("beforeend",'<div class="empty">Novas regras entram nas próximas etapas.</div>');
}
async function run(){
  $("run").disabled=true; $("sum").className="empty"; $("sum").textContent="Executando…";
  const sel=new Set([...document.querySelectorAll("#rules input:checked")].map(i=>i.dataset.r));
  RESULTS=[];
  const ctx={layers:LAYERS,dict:DICT,get:n=>LAYERS[n],tol:Math.max(0,parseFloat($("tol").value)||0),wtol:Math.max(0,parseFloat($("wtol").value)||0),vtol:Math.max(0,parseFloat($("vtol").value)||0)};
  H.W=ctx.wtol;
  for(const r of RULES) if(sel.has(r.id)){
    try{ (await r.run(ctx)).forEach(x=>RESULTS.push({regra:r.id,...x})); }
    catch(e){ RESULTS.push({regra:r.id,camada:"—",msg:"Falha ao executar a regra: "+e.message,sev:"erro"}); }
  }
  showResults(); $("run").disabled=false;
}
function showResults(){
  const er=RESULTS.filter(r=>r.sev==="erro").length, av=RESULTS.filter(r=>r.sev==="aviso").length;
  $("sum").className=er?"tag er":av?"tag wn":"tag ok";
  $("sum").textContent=RESULTS.length?`${er} erro(s) · ${av} aviso(s)`:"Nenhuma inconsistência encontrada";
  $("csv").disabled=!RESULTS.length;
  $("tbl").innerHTML=RESULTS.length?`<table><tr><th>Regra</th><th>Camada</th><th>Feição</th><th>Gravidade</th><th>Descrição</th><th>Área (m²)</th></tr>${RESULTS.map((r,i)=>`<tr class="row" data-i="${i}"><td>${r.regra}</td><td>${r.camada||""}</td><td>${r.fid??""}</td><td><span class="tag ${r.sev==="erro"?"er":"wn"}">${r.sev}</span></td><td>${r.msg}</td><td>${r.area!=null?r.area.toLocaleString("pt-BR",{maximumFractionDigits:2}):""}</td></tr>`).join("")}</table>`:"";
}
$("tbl").addEventListener("click",e=>{
  const tr=e.target.closest("tr.row"); if(!tr) return;
  const r=RESULTS[+tr.dataset.i]; if(hl){hl.remove();hl=null;}
  if(r.geom){ hl=L.geoJSON(r.geom,{style:{color:"#e60026",weight:3,fillOpacity:.4},pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:8,color:"#e60026"})}).addTo(map); map.fitBounds(hl.getBounds(),{maxZoom:18,padding:[40,40]}); }
});
$("csv").onclick=()=>{
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const rows=[["Regra","Camada","Feição","Gravidade","Descrição","Área (m²)"],...RESULTS.map(r=>[r.regra,r.camada,r.fid,r.sev,r.msg,r.area!=null?r.area.toFixed(2).replace(".",","):""])];
  const blob=new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="verificacao_topologica.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$("run").onclick=run;
$("pickDir").onclick=pickDir; $("reDir").onclick=reopenDir; $("stopDir").onclick=stopWatch;
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{ if(e.target.files.length) load([...e.target.files]); e.target.value=""; };
const dz=$("drop");
["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over");}));
["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over");}));
dz.addEventListener("drop",e=>{ if(e.dataTransfer.files.length) load([...e.dataTransfer.files]); });
$("verBtn").onclick=()=>$("dlgVer").classList.add("on");
$("dictBtn").onclick=()=>$("dlgDict").classList.add("on");
$("chg").innerHTML=CHANGELOG.map(c=>`<li><b>v${c.v}</b> · ${c.d}<ul>${c.t.map(x=>`<li>${x}</li>`).join("")}</ul></li>`).join("");
$("dictBody").innerHTML=`<table><tr><th>Camada</th><th>Geom.</th><th>Campos</th></tr>${Object.entries(DICT).map(([n,d])=>`<tr><td><b>${n}</b>${d.grupo?`<br><small>grupo ${d.grupo}</small>`:""}</td><td>${d.g==="PT"?"ponto":"polígono"}</td><td>${d.f.map(f=>`${f[0]} <small>(${TIPO_NOME[f[1]]})</small>`).join(", ")}</td></tr>`).join("")}</table>`;
document.querySelectorAll(".dlg").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.classList.remove("on");}));
renderLayers(); renderRules(); initDir();
</script>
